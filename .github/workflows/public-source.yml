name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the locked Electron runtime
        run: node node_modules/electron/install.js
      - run: npm run notices:check
      - run: node --test scripts/check-windows-distribution.mjs
      - run: npm run public:check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run public:test
      - run: npm test
      - run: npm run build
      - run: npm run public:release-check
